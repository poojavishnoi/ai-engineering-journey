<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#FFEFE7;--ink:#22140F;--muted:#8F6656;--accent:#F0624D;--card:#FFFFFF;--line:#F5D3C4}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1350px}
body{background:#FFFFFF;padding:44px;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
.frame{height:100%;background:var(--bg);color:var(--ink);border-radius:44px;display:flex;flex-direction:column;padding:64px 70px 52px}
.series{font-size:19px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.foot{margin-top:auto;padding-top:22px;border-top:2px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;font-size:24px;color:var(--muted)}
.foot b{color:var(--ink);font-size:28px}
.c{flex:1;display:flex;flex-direction:column;justify-content:center}
.big{font-size:84px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.big span{color:var(--accent)}
.sub{margin-top:28px;font-size:36px;font-weight:600;color:var(--muted);line-height:1.3}

.old{font-size:150px;font-weight:800;color:var(--muted);opacity:.55;text-decoration:line-through;text-decoration-thickness:12px;text-decoration-color:var(--accent);letter-spacing:-.04em}
.new{font-size:280px;font-weight:800;color:var(--accent);letter-spacing:-.05em;line-height:1}
</style></head><body><div class="frame"><div class="series">Everyday Engineering · 08</div>
<div class="c"><div class="old">₹180</div><div class="new">₹280</div>
<div class="big" style="margin-top:50px">Same ride.<br><span>It just started raining.</span></div></div>
<div class="foot"><b>Who decided that price?</b><span>Read the post ↓</span></div></div></body></html>
