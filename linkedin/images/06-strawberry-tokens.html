<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body {
    background: #D3E4F7; color: #141414;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
    padding: 100px 100px 80px;
  }
  .series { font-size: 19px; letter-spacing: 0.14em; text-transform: uppercase; color: #5B6B7F; font-weight: 600; }
  h1 { margin-top: 32px; font-size: 76px; line-height: 1.06; font-weight: 700; letter-spacing: -0.03em; }
  h1 span { color: #5B6B7F; }
  .card { margin-top: 44px; background: #FFFFFF; border-radius: 28px; padding: 36px 44px 40px; }
  .card + .card { margin-top: 28px; }
  .label { font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; color: #5B6B7F; }
  .letters { display: flex; gap: 10px; margin-top: 26px; }
  .l { width: 70px; height: 84px; border-radius: 12px; background: #EEF2F6; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 700; font-family: "SF Mono", Menlo, monospace; }
  .l.r { background: #2F6FB3; color: #FFFFFF; }
  .chunks { display: flex; gap: 18px; margin-top: 26px; }
  .c { flex: 1; height: 84px; border-radius: 12px; background: #EEF2F6; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 700; font-family: "SF Mono", Menlo, monospace; }
  .ids { display: flex; gap: 18px; margin-top: 12px; }
  .ids div { flex: 1; text-align: center; font-size: 24px; color: #5B6B7F; font-family: "SF Mono", Menlo, monospace; }
  .result { margin-top: 26px; padding-top: 22px; border-top: 2px solid #EEF2F6; font-size: 30px; font-weight: 700; }
  .good { color: #2E7D4F; } .bad { color: #B4651A; }
  .foot { margin-top: auto; padding-top: 26px; border-top: 2px solid #B7CCE4; display: flex; justify-content: space-between; font-size: 22px; color: #5B6B7F; }
  .foot b { color: #141414; font-size: 26px; }
</style>
</head>
<body>
  <div class="series">Everyday Engineering · 06</div>
  <h1>How many r's in strawberry?<br><span>The AI can't see them.</span></h1>

  <div class="card">
    <div class="label">What you see</div>
    <div class="letters">
      <div class="l">s</div><div class="l">t</div><div class="l r">r</div><div class="l">a</div><div class="l">w</div>
      <div class="l">b</div><div class="l">e</div><div class="l r">r</div><div class="l r">r</div><div class="l">y</div>
    </div>
    <div class="result good">10 letters. Count the r's: 3.</div>
  </div>

  <div class="card">
    <div class="label">What the AI sees</div>
    <div class="chunks"><div class="c">straw</div><div class="c">berry</div></div>
    <div class="result bad">2 chunks. No letters to count, so it guesses.</div>
  </div>

  <div class="foot"><b>AI reads chunks called tokens, not letters.</b><span>Split from my own tokenizer</span></div>
</body>
</html>
